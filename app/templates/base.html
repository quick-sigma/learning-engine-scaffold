<!DOCTYPE html>
<html lang="es" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Learning Engine{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/js/htmx.min.js" defer></script>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="/">Learning Engine</a>
    {% include "partials/tabs.html" %}
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="Cambiar tema">◐</button>
  </header>
  <main id="tabpanel" class="container" role="tabpanel">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/js/audio-player.js" defer></script>
  <script>
    (function () {
      const root = document.documentElement;
      const saved = localStorage.getItem('theme');
      if (saved) root.dataset.theme = saved;
      document.getElementById('theme-toggle').addEventListener('click', () => {
        const order = { auto: 'light', light: 'dark', dark: 'auto' };
        const next = order[root.dataset.theme] || 'dark';
        root.dataset.theme = next;
        localStorage.setItem('theme', next);
      });
    })();
  </script>
</body>
</html>
