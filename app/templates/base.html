<!DOCTYPE html>
<html lang="es" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Learning Engine{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/forms.css">
  <script src="/static/js/htmx.min.js" defer></script>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="/">Learning Engine</a>
    {% include "partials/tabs.html" %}
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="Cambiar tema" title="Tema: automático">
      <svg class="theme-ico theme-ico-auto" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg>
      <svg class="theme-ico theme-ico-light" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="theme-ico theme-ico-dark" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>
  <main id="tabpanel" class="container" role="tabpanel">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/js/audio-player.js" defer></script>
  <script>
    (function () {
      const root = document.documentElement;
      const btn = document.getElementById('theme-toggle');
      const labels = { auto: 'Tema: automático', light: 'Tema: claro', dark: 'Tema: oscuro' };
      function apply(mode) {
        root.dataset.theme = mode;
        btn.title = labels[mode] || labels.auto;
        btn.setAttribute('aria-label', 'Cambiar tema. ' + (labels[mode] || labels.auto));
        localStorage.setItem('theme', mode);
      }
      apply(localStorage.getItem('theme') || 'auto');
      btn.addEventListener('click', () => {
        const order = { auto: 'light', light: 'dark', dark: 'auto' };
        apply(order[root.dataset.theme] || 'dark');
      });
    })();
  </script>
</body>
</html>
