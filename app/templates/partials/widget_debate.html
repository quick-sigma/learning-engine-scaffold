{% if widget %}
<div class="widget debate-widget"
     data-widget="debate"
     data-widget-id="{{ slide.id }}"
     data-lesson="{{ lesson_id }}"
     data-turns='{{ widget.turns | default([]) | tojson }}'
     data-thesis='{{ widget.thesis | default("") | tojson }}'
     data-opening='{{ widget.opening | default("") | tojson }}'>

  <p class="debate-thesis instructions">{{ widget.thesis }}</p>

  <div class="debate" data-debate aria-live="polite">
    <div class="debate-msg agent">
      <div class="debate-role agent">Contrincante</div>
      {{ widget.opening }}
    </div>
  </div>

  <div class="widget-feedback" data-debate-feedback aria-live="polite"></div>
</div>
{% endif %}
