{% if widget %}
<div class="widget canvas-widget"
     data-widget="canvas"
     data-widget-id="{{ slide.id }}"
     data-lesson="{{ lesson_id }}"
     data-concepts='{{ widget.concepts | default([]) | tojson }}'
     data-relations='{{ widget.relations | default([]) | tojson }}'
     data-initial='{{ widget.initial | default({}) | tojson }}'
     data-task="{{ widget.task or '' }}"
     data-hint="{{ widget.hint or '' }}">

  <div class="widget-toolbar">
    <button type="button" class="btn btn-sm btn-secondary" data-canvas-add>+ Concepto</button>
    <button type="button" class="btn btn-sm" data-canvas-save>Guardar lienzo</button>
    <button type="button" class="btn btn-sm btn-ghost" data-canvas-clear>Limpiar</button>
    <span class="widget-hint muted">Arrastra nodos · clic en 2 nodos para conectar</span>
  </div>

  <div class="canvas-wrap" data-canvas-wrap>
    <svg class="canvas-svg" role="img" aria-label="{{ widget.task or 'Lienzo de conceptos' }}" data-canvas-svg></svg>
  </div>

  <div class="widget-feedback" data-canvas-feedback aria-live="polite"></div>
</div>
{% endif %}
