[project]
name = "learning-engine"
version = "0.1.0"
description = "Cognitive Learning Engine — FastAPI + HTMX scaffold"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
learning = "main:app"

[tool.uv]
package = false
